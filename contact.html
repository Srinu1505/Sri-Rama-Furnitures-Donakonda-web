<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .form-container {
      background-color: aqua;
      max-width: 400px;
      margin: 50px auto;
      padding: 20px 30px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    form h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      background-color: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }

    @media (max-width: 500px) {
      .form-container {
        margin: 20px;
        padding: 15px;
      }
    }
  </style>
</head>
<body>

  <div class="form-container">
    <form id="userForm" onsubmit="getFormData(event)">
      <h2>Contact Form</h2>
      <input type="text" name="userName" placeholder="Enter Name" required>
      <input type="number" name="userAge" placeholder="Enter Age" required>
      <input type="email" name="userEmail" placeholder="Enter Email" required>
      <input type="tel" name="userNumber" placeholder="Enter Phone Number" required>
      <input type="date" name="userDOB" required>
      <button type="submit">Submit</button>
    </form>
  </div>

  <script>
    function getFormData(event) {
      event.preventDefault();

      const form = document.getElementById("userForm");
      const data = {
        userName: form.userName.value,
        userAge: form.userAge.value,
        userEmail: form.userEmail.value,
        userNumber: form.userNumber.value,
        userDOB: form.userDOB.value
      };

      console.log("Form Data Submitted:", data);
      alert("Form submitted successfully!");

      form.reset();
    }
  </script>

</body>
</html>
